name: Upload Assets

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  upload-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1.4.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Validate and compile Calcit
        run: |
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze check-public \
            --ns app.comp.container \
            --ns app.config \
            --ns app.main \
            --ns app.schema \
            --ns app.updater \
            --summary-only
          calcit calcit.cirru analyze check-types --summary-only
          calcit calcit.cirru analyze weak-types \
            --only schema-dynamic,unresolved-type-slot,code-dynamic \
            --intent unresolved \
            --summary-only
          calcit calcit.cirru analyze dynamic-methods --max 0
          calcit calcit.cirru analyze deprecated --summary-only
          calcit calcit.cirru js

      - run: yarn vite build --base=./
        name: Build web assets

      - name: Deploy to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deploy
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"
