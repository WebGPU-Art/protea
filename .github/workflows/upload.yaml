name: Upload Assets

on:
  pull_request: {}
  push:
    branches:
      - main

concurrency:
  group: frontend-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  upload-assets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru

      - name: Validate and compile Calcit
        run: |
          set -euo pipefail
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          calcit calcit.cirru edit transaction --code '[["edit","format"]]' --dry-run --format json | jq -e '.changed == false'
          calcit calcit.cirru --check-only --all-defs
          calcit fix --workflow strict --verify --format json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
          calcit calcit.cirru js

      - name: Build web assets
        env:
          ASSET_BASE_URL: https://cos-sh.tiye.me/${{ github.repository }}/
        run: yarn vite build --base="$ASSET_BASE_URL"

      - name: Check current production revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skip stale production revision ${GITHUB_SHA}; current main is ${current_sha}."
          fi

      - name: Upload and verify frontend assets
        if: steps.production.outputs.current == 'true'
        timeout-minutes: 10
        uses: worktools/cos-upload-action@v1.2.0
        with:
          source-dir: dist/assets
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ github.repository }}/assets/
          public-base-url: https://cos-sh.tiye.me/${{ github.repository }}/assets/
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Recheck main before publishing the page
        if: steps.production.outputs.current == 'true'
        id: page-revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skip stale page revision ${GITHUB_SHA}; current main is ${current_sha}."
          fi

      - name: Deploy to server
        if: steps.page-revision.outputs.current == 'true'
        id: deploy
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: steps.page-revision.outputs.current == 'true'
        run: echo "${{ steps.deploy.outputs.status }}"
